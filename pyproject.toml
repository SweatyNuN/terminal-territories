[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "terminal-territories"
version = "0.1.0"
description = "A multiplayer terminal strategy game for teaching networking, APIs, concurrency and distributed systems."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["game", "teaching", "networking", "terminal", "multiplayer", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]

# Phase 1 baseline: a Textual client and a FastAPI server.
# Keep this list small; add phase-specific packages to extras below.
dependencies = [
    "textual>=0.89",
    "rich>=13.9",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
]

[project.optional-dependencies]
# Phase 2+: persistence.
db = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
]
# Phase 4+: the client side of WebSocket transport (uvicorn[standard] already
# provides a server implementation).
realtime = [
    "websockets>=13",
]
# Phase 0 stretch: property-based tests for rule invariants.
reliability = [
    "hypothesis>=6.100",
]
# Only if you build the non-Textual CLI fallback mentioned in human_notes.md.
prompt = [
    "prompt-toolkit>=3.0",
]
# Everything needed to develop and validate any phase.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
# Convenience install for the full course: pip install -e ".[full]"
full = [
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "websockets>=13",
    "hypothesis>=6.100",
    "prompt-toolkit>=3.0",
]

# Entry points are added when the modules exist (see deepseek_help/02-development-phases.md):
# [project.scripts]
# tt = "terminal_territories.cli:main"
# tt-server = "terminal_territories.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["terminal_territories"]

[tool.hatch.build.targets.sdist]
include = [
    "/terminal_territories",
    "/tests",
    "/README.md",
]

# --- Testing ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises a real server or database",
    "transport: exercises sockets or framing",
    "slow: excluded from the inner development loop",
]

[tool.coverage.run]
branch = true
source = ["terminal_territories"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --- Linting and typing ----------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# Design docs contain illustrative Python snippets; keep them byte-stable.
extend-exclude = ["deepseek_help"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["terminal_territories"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
