[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "terminal-territories"
version = "0.1.0"
description = "A multiplayer, turn-based territory game built as a personal learning project for networking, APIs, concurrency and distributed systems."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["game", "learning", "networking", "terminal", "multiplayer", "rest", "sockets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]

# Runtime is intentionally standard-library-only for now.
dependencies = []

[project.optional-dependencies]
# Development and test tools only.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    # Only for the retained Textual experiment and its test; the game client is stdlib-only.
    "textual>=0.89",
]

# Entry points are added when the modules exist (see planning/02-development-phases.md):
# [project.scripts]
# tt = "terminal_territories.cli:main"
# tt-server = "terminal_territories.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["terminal_territories"]

[tool.hatch.build.targets.sdist]
include = [
    "/terminal_territories",
    "/tests",
    "/README.md",
    "/PACKAGES.md",
]

# --- Testing ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises a real server or database",
    "transport: exercises sockets or framing",
    "slow: excluded from the inner development loop",
]

# --- Linting and typing ----------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# Design docs contain illustrative Python snippets; keep them byte-stable.
extend-exclude = ["planning"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["terminal_territories"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
